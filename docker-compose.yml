# ur5e-manip-hardware: perception stack for real-robot experiments.
#
#   pose         FoundationPose 6D pose sidecar   :5667
#   pointso      PointSO semantic-orientation     :5668
#   ros2-bridge  ROS2 Humble <-> ZMQ bridge       (DDS on host network)
#
# No profiles -- this is the whole stack, so bring it all up at once:
#   docker compose up -d --build
#
# Everything is privileged + host-networked with full driver capabilities.
# Privileged mode exposes all of /dev, so a USB RealSense (or any camera)
# plugged into the workstation is directly visible inside ros2-bridge if
# you ever run the camera driver in-container.
#
# The one exception to "host-networked" is the AnyGrasp sidecar (5666): its
# license fingerprint hashes the set of MACs `ifconfig` reports, so it runs
# on its own bridge network with a pinned MAC and a published port. See the
# header of docker/Dockerfile.anygrasp for why.

services:

  # ======================================================================
  # grasp: AnyGrasp SDK sidecar (port 5666)
  #
  # NOT host-networked, unlike every other service here, and that is
  # deliberate. AnyGrasp's feature id is sha256 over the sorted set of MAC
  # addresses `ifconfig` reports; on host networking that set includes
  # docker0 and the br-*/veth* of whatever else is running, so it changes
  # out from under the license. Own bridge network + pinned MAC = exactly
  # one ether line, always the same one.
  #
  #   ANYGRASP_MAC  must be the MAC the license was issued for. Set it in
  #                 .env; normally this workstation's permanent NIC:
  #                     echo "ANYGRASP_MAC=$(cat /sys/class/net/eno1/address)" >> .env
  #                 Don't know which MAC? `docker compose run --rm grasp scan ...`
  # ======================================================================
  grasp:
    build:
      context: .
      dockerfile: docker/Dockerfile.anygrasp
    image: manip-grasp:latest
    container_name: AnyGraspServer
    networks:
      grasp_net:
        # 02:… placeholder is intentionally wrong -- an unset ANYGRASP_MAC
        # should fail the license check loudly, not silently drift.
        mac_address: ${ANYGRASP_MAC:-02:00:00:00:00:00}
    ports:
      # 0.0.0.0 (not 127.0.0.1) so the sim wing on this box can reach it via
      # its `grasp:host-gateway` alias. Narrow to "127.0.0.1:5666:5666" if
      # nothing outside this host should see the grasp server.
      - "5666:5666"
    cap_add:
      - NET_ADMIN            # only for `scan`, which rewrites eth0's MAC
    ipc: host
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./grasp_server:/opt/grasp_server
      - ./anygrasp_runtime/license:/opt/anygrasp/grasp_detection/license
      - ./anygrasp_runtime/checkpoints:/opt/anygrasp/checkpoints
    environment:
      - GRASP_PORT=5666
      - PYTHONPATH=/opt/anygrasp/grasp_detection
      - GRASP_MAX_WIDTH=0.085          # Robotiq 2F-85 stroke; <= 0.1 (SDK cap)
      - GRASP_HEIGHT=0.03
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TORCH_CUDA_ARCH_LIST=8.6
      # Same soft-pin as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true

  # ======================================================================
  # pose: FoundationPose sidecar (port 5667)
  # ======================================================================
  pose:
    build:
      context: .
      dockerfile: docker/Dockerfile.foundationpose
    image: manip-pose:latest
    container_name: PoseServer
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./pose_server:/opt/pose_server
      - ./foundationpose_runtime/weights:/opt/FoundationPose/weights
      - ./foundationpose_runtime/meshes:/opt/meshes
      # TRELLIS.2 outputs, read-only: pass an absolute /data/meshes/*.glb as
      # `mesh` to register FoundationPose on a generated metric mesh
      - ./trellis2_runtime/outputs:/data/meshes:ro
      - /tmp/.X11-unix:/tmp/.X11-unix      # only needed for debug viz
    environment:
      - POSE_PORT=5667
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all     # nvdiffrast wants graphics caps
      - TORCH_CUDA_ARCH_LIST=8.6
      - DISPLAY=${DISPLAY}
      # GPUs 1-2 run the FSDP VLA training on this workstation; soft-pin
      # to GPU 0. Delete to let it roam over all three.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true

  # ======================================================================
  # pointso: PointSO sidecar (port 5668)
  # ======================================================================
  pointso:
    build:
      context: .
      dockerfile: docker/Dockerfile.pointso
    image: manip-pointso:latest
    container_name: PointSOServer
    network_mode: host
    ipc: host
    privileged: true
    gpus: all
    restart: unless-stopped
    volumes:
      - ./pointso_server:/opt/pointso_server
      - ./pointso_runtime/checkpoints:/opt/SoFar/checkpoints
    environment:
      - POINTSO_PORT=5668
      # - POINTSO_CKPT=checkpoints/base_finetune.pth 
      - POINTSO_CKPT=checkpoints/small.pth 
      - TORCH_CUDA_ARCH_LIST=8.6
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Same soft-pin as pose; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true

  # ======================================================================
  # ros2-bridge: ROS2 Humble <-> ZMQ sidecars (no GPU)
  # ======================================================================
  ros2-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2
    image: manip-ros2-bridge:latest
    container_name: Ros2Bridge
    network_mode: host        # DDS discovery with the UR5e box / other machines
    ipc: host                 # DDS shared-memory transport
    # pid: host
    privileged: true          # full /dev access (USB cameras, etc.)
    # rviz2 ONLY -- the bridge nodes themselves are pure ZMQ clients with no
    # CUDA and no model code, and that separation is the whole point of this
    # image. This is here for the `graphics` driver capability (GL library
    # injection), not for compute. Drop it and rviz falls back to llvmpipe
    # software rendering, which is usable until you add a PointCloud2 display.
    gpus: all
    restart: unless-stopped
    working_dir: /root/ros2_ws
    volumes:
      # rviz2 / rqt. Host side needs, once per login:  xhost +local:docker
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Dev workspace: edit + colcon build from the host copy. build/ install/
      # log/ land on the host too, so builds survive container recreation.
      - ./ros2_ws:/root/ros2_ws
      # Legacy loose scripts, mounted inside the workspace so one launch file
      # coordinates everything. COLCON_IGNORE keeps colcon from building it.
      - ./ros2_bridge:/root/ros2_ws/src/ros2_bridge
      - ./trellis2_runtime/outputs:/data/meshes
      - ./any6d_runtime/outputs:/data/any6d:ro
      # rosbag2 recordings for offline replay:  ros2 bag play /bags/<name> --clock
      #
      # This default must stay in sync with .env.example. `:-` also treats an
      # EMPTY BAG_DIR as unset, and Docker auto-creates a missing bind-mount
      # source -- so a stale, empty, or absent .env silently creates an empty
      # host dir and mounts it read-only. `ls /bags` then comes back empty with
      # no error anywhere and it looks like the recording vanished. Check what
      # compose actually resolved:   docker compose config | grep -A3 /bags
      - ${BAG_DIR:-./ros2bags}:/bags
      # run_scene artifacts (rgb/depth/masks/overlays/summary.json)
      - ./outputs/runs:/data/runs
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - POSE_ADDR=tcp://127.0.0.1:5667     # host-net: sidecars are localhost
      - POINTSO_ADDR=tcp://127.0.0.1:5668
      - GRASP_ADDR=tcp://127.0.0.1:5666
      - TRELLIS_ADDR=tcp://127.0.0.1:5669
      - SAM3_ADDR=tcp://127.0.0.1:5670
      - ANY6D_ADDR=tcp://127.0.0.1:5672
      - ORIANY_ADDR=tcp://127.0.0.1:5673
      - RUN_OUT_DIR=/data/runs
      # Camera topics for THIS bag / camera. Read them off `ros2 bag info`.
      # Used as the parameter defaults by bridges.launch.py AND by run_scene
      # (which is `ros2 run` and does not inherit launch arguments), so this
      # is the single place to set them. Launch args still override.
      - RGB_TOPIC=${RGB_TOPIC:-/camera/camera/color/image_raw}
      - DEPTH_TOPIC=${DEPTH_TOPIC:-/camera/camera/aligned_depth_to_color/image_raw}
      - INFO_TOPIC=${INFO_TOPIC:-/camera/camera/color/camera_info}
      # --- rviz2 / rqt ----------------------------------------------------
      # DISPLAY is inherited from the shell that runs `docker compose`; an
      # unset value degrades to an empty string and rviz2 exits with
      # "cannot connect to X server". Over ssh, use `ssh -X` and check that
      # $DISPLAY is set BEFORE compose, not inside the container.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # `graphics` -- not just utility/compute -- is what makes hardware GL
      # work. Every other service in this file uses `all`; this one is
      # explicit because the list is the entire reason `gpus: all` is here.
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    # Launch all bridges once the workspace has been colcon-built; before the
    # first build, idle in a shell so you can exec in and build:
    #   docker exec -it Ros2Bridge bash
    #   colcon build --symlink-install && exit
    #   docker compose restart ros2-bridge
    command: >
      bash -lc "if [ -f install/setup.bash ]; then
        source /opt/ros/humble/setup.bash && source install/setup.bash &&
        ros2 launch manip_bridge bridges.launch.py;
      else
        echo 'ros2_ws not built yet -- exec in, colcon build, then restart';
        exec bash;
      fi"
    stdin_open: true
    tty: true
  
  # ======================================================================
  # trellis2: TRELLIS.2 sidecar (port 5669)
  # ======================================================================
  trellis2:
    build:
      context: .
      dockerfile: docker/Dockerfile.trellis2
    image: manip-trellis2:latest
    container_name: Trellis2Server
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./trellis2_server:/opt/trellis2_server
      - ./trellis2_runtime/hf_cache:/opt/hf_cache      # ~15GB weights on first pull
      - ./trellis2_runtime/outputs:/data/meshes        # GLBs land here (bridge sees same host dir)
    environment:
      - TRELLIS_PORT=5669
      - TRELLIS_OUT_DIR=/data/meshes
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all                 # nvdiffrast/nvdiffrec want graphics caps
      - TORCH_CUDA_ARCH_LIST=8.6
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True   # repo-recommended; matters at 24GB
      - HF_TOKEN=${HF_TOKEN:-}
      # - ATTN_BACKEND=xformers    # only for GPUs without flash-attn support; 3090 is fine
      # Same soft-pin convention as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true
  # ======================================================================
  # sam3: SAM 3 open-vocabulary segmentation sidecar (port 5670)
  # ======================================================================
  sam3:
    build:
      context: .
      dockerfile: docker/Dockerfile.sam3
    image: manip-sam3:latest
    container_name: Sam3Server
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./sam3_server:/opt/sam3_server
      - ./sam3_runtime/hf_cache:/opt/hf_cache   # sam3.pt (~3.4GB) on first pull
    environment:
      - SAM3_PORT=5670
      - SAM3_VERSION=sam3                       # or sam3.1 (multiplex ckpt)
      # Checkpoints are GATED: request access at hf.co/facebook/sam3, then
      # `export HF_TOKEN=hf_...` in your shell before first `up`. Once the
      # ckpt is in the mounted cache the token is no longer needed.
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TORCH_CUDA_ARCH_LIST=8.6
      # Same soft-pin as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    # entrypoint: ["bash", "-lc"]
    # command: "source /opt/conda/etc/profile.d/conda.sh && conda activate sam3 && python /opt/sam3_server/server.py"
    stdin_open: true
    tty: true
  # ======================================================================
  # curobo: cuRoboV2 ESDF mapping / motion-gen sidecar (port 5671)
  # ======================================================================
  curobo:
    build:
      context: .
      dockerfile: docker/Dockerfile.curobo
    image: manip-curobo:latest
    container_name: CuroboServer
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./curobo_server:/opt/curobo_server
      - ./curobo_runtime/kernel_cache:/opt/kernel_cache   # warp JIT cache; ~30-60s cold without it
      - ./curobo_runtime/checkpoints:/data/tsdf_blocks    # mapper.save_blocks() output (resume across restarts)
    environment:
      - CUROBO_PORT=5671
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TORCH_CUDA_ARCH_LIST=8.6
      # Default mapper config; the server also accepts a "configure" cmd to
      # rebuild the Mapper with different params at runtime.
      - CUROBO_VOXEL_SIZE=0.01
      - CUROBO_EXTENT=2.0,2.0,1.5          # meters, xyz, centered on map origin
      - CUROBO_IMAGE_HEIGHT=480            # RealSense D4xx depth at 480p
      - CUROBO_IMAGE_WIDTH=848
      - CUROBO_NUM_CAMERAS=1
      # viser debug viz (server started only if CUROBO_VISUALIZE=1); host-net,
      # so http://localhost:8080 -- same port family as nothing else here.
      # - CUROBO_VISUALIZE=1
      # Same soft-pin as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true
  # ======================================================================
  # any6d: Any6D model-free 6D pose + metric-scale mesh sidecar (port 5672)
  # ======================================================================
  any6d:
    build:
      context: .
      dockerfile: docker/Dockerfile.any6d
    image: manip-any6d:latest
    container_name: Any6DServer
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./any6d_server:/opt/any6d_server
      # FoundationPose refiner/scorer -- SAME host dir as the pose sidecar
      # (identical checkpoints; don't duplicate 2GB on disk)
      - ./foundationpose_runtime/weights:/opt/Any6D/foundationpose/weights
      # Reference meshes shared with pose (Any6D rescales, so non-metric
      # TRELLIS.2 / InstantMesh outputs are fine here too)
      - ./foundationpose_runtime/meshes:/opt/meshes
      - ./trellis2_runtime/outputs:/data/meshes:ro   # TRELLIS GLBs as reference meshes
      - ./any6d_runtime/sam2_ckpts:/opt/Any6D/sam2/checkpoints
      - ./any6d_runtime/instantmesh_ckpts:/opt/Any6D/instantmesh/ckpts
      - ./any6d_runtime/outputs:/data/any6d     # scaled meshes out
    environment:
      - ANY6D_PORT=5672
      - ANY6D_OUT_DIR=/data/any6d
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all     # nvdiffrast wants graphics caps
      - TORCH_CUDA_ARCH_LIST=8.6
      # Same soft-pin as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true
  
  # ======================================================================
  # oriany: Orient Anything V2 sidecar (port 5673)
  # ======================================================================
  oriany:
    build:
      context: .
      dockerfile: docker/Dockerfile.orientanything
    image: manip-oriany:latest
    container_name: OriAnyServer
    network_mode: host
    ipc: host
    privileged: true
    shm_size: '8gb'
    gpus: all
    restart: unless-stopped
    volumes:
      - ./oriany_server:/opt/oriany_server
      - ./oriany_runtime/hf_cache:/opt/hf_cache   # 5GB ckpt + u2net on first pull
    environment:
      - ORIANY_PORT=5673
      # Point at a local .pt to skip the HF pull entirely:
      # - ORIANY_CKPT=/opt/hf_cache/rotmod_realrotaug_best.pt
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TORCH_CUDA_ARCH_LIST=8.6
      - HF_TOKEN=${HF_TOKEN:-}
      # Same soft-pin as pose/pointso; delete to roam.
      # - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true

networks:
  # Dedicated bridge for the grasp sidecar. Nothing else joins it; its only
  # job is to give the container exactly one NIC whose MAC we control.
  grasp_net:
    driver: bridge
